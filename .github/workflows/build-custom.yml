name: build-custom

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
          - os: macos-14
            name: macos
    runs-on: ${{ matrix.os }}
    env:
      RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
      RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Eigene Server-Einstellungen eintragen
        shell: bash
        run: |
          python3 - <<'EOF'
          import os, re, sys
          path = "libs/hbb_common/src/config.rs"
          src = open(path, encoding="utf-8").read()
          server = os.environ["RENDEZVOUS_SERVER"]
          key = os.environ["RS_PUB_KEY"]
          if not server or not key:
              sys.exit("Fehler: Secrets RENDEZVOUS_SERVER oder RS_PUB_KEY sind leer")

          # Liste mit einem Eintrag, z.B. ["rustdesk.meinedomain.de"]
          src, n1 = re.subn(
              r'(pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[)[^\]]*(\];)',
              lambda m: m.group(1) + '"' + server + '"' + m.group(2),
              src,
          )
          # Public Key
          src, n2 = re.subn(
              r'(pub const RS_PUB_KEY: &str = )"[^"]*"',
              lambda m: m.group(1) + '"' + key + '"',
              src,
          )
          print(f"RENDEZVOUS_SERVERS: {n1} Ersetzung(en)")
          print(f"RS_PUB_KEY: {n2} Ersetzung(en)")
          if n1 == 0 or n2 == 0:
              sys.exit("Konstante nicht gefunden, bitte config.rs prüfen")
          open(path, "w", encoding="utf-8").write(src)
          EOF
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}



      - name: Rust installieren
        uses: dtolnay/rust-toolchain@stable

      - name: Flutter installieren
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"

      - name: Linux-Abhängigkeiten
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev libxdo-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev libpulse-dev libssl-dev libclang-dev ninja-build \
            libayatana-appindicator3-dev \
            libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-good1.0-dev


      - name: macOS-Abhängigkeiten
        if: matrix.name == 'macos'
        run: brew install create-dmg

      - name: vcpkg-Abhängigkeiten (Windows)
        if: matrix.name == 'windows'
        shell: bash
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh
          ./vcpkg/vcpkg install --triplet x64-windows-static

      - name: Build
        shell: bash
        run: |
          python3 build.py --flutter

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-${{ matrix.name }}
          path: |
            rustdesk-*.exe
            rustdesk-*.dmg
            rustdesk-*.deb
            flutter/build/linux/x64/release/bundle/**
            flutter/build/macos/Build/Products/Release/*.app
            flutter/build/windows/x64/runner/Release/**
          if-no-files-found: warn
