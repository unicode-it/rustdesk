name: build-custom

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
          - os: macos-14
            name: macos
    runs-on: ${{ matrix.os }}
    env:
      RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
      RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Eigene Server-Einstellungen eintragen
        shell: bash
        run: |
          sed -i "s|DEFAULT_RENDEZVOUS_SERVER: &str = \"[^\"]*\"|DEFAULT_RENDEZVOUS_SERVER: \&str = \"${RENDEZVOUS_SERVER}\"|" libs/hbb_common/src/config.rs
          sed -i "s|DEFAULT_RS_PUB_KEY: &str = \"[^\"]*\"|DEFAULT_RS_PUB_KEY: \&str = \"${RS_PUB_KEY}\"|" libs/hbb_common/src/config.rs
          grep -n "DEFAULT_RENDEZVOUS_SERVER\|DEFAULT_RS_PUB_KEY" libs/hbb_common/src/config.rs

      - name: Rust installieren
        uses: dtolnay/rust-toolchain@stable

      - name: Flutter installieren
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"

      - name: Linux-Abhängigkeiten
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev libpulse-dev libssl-dev libclang-dev ninja-build libayatana-appindicator3-dev

      - name: macOS-Abhängigkeiten
        if: matrix.name == 'macos'
        run: brew install create-dmg

      - name: vcpkg-Abhängigkeiten (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh
          ./vcpkg/vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Build
        shell: bash
        run: |
          python3 build.py --flutter

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-${{ matrix.name }}
          path: |
            rustdesk-*.exe
            rustdesk-*.dmg
            rustdesk-*.deb
            flutter/build/linux/x64/release/bundle/**
            flutter/build/macos/Build/Products/Release/*.app
            flutter/build/windows/x64/runner/Release/**
          if-no-files-found: warn
